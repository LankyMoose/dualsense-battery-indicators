[package]
name = "ps5-battery-display"
version = "0.1.0"
edition = "2024"
description = "Show DualSense (PS5) controller battery levels in the system tray"
license = "MIT"
readme = "README.md"
build = "build.rs"

[dependencies]
crc32fast = "1.5.0"
hidapi = "2.6.6"
single-instance = "0.3.3"

[build-dependencies]
ico = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }
