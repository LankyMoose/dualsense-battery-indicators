[package]
name = "dualsense-battery-indicators"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
description = "DualSense Battery Indicators — show DualSense controller battery levels in the system tray"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/dualsense-battery-indicators"
homepage = "https://github.com/LankyMoose/dualsense-battery-indicators"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"

[features]
default = []
dev-emulate = []

[dependencies]
crc32fast = "1.5.0"
hidapi = "2.6.6"
iced = { version = "0.14.0", features = ["canvas", "tokio", "svg", "image"] }
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3.3"

[build-dependencies]
ico = "0.4"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
