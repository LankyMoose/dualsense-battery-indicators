[package]
name = "dualsense-battery-indicators"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "DualSense Battery Indicators — show DualSense controller battery levels in the system tray"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/dualsense-battery-indicators"
homepage = "https://github.com/LankyMoose/dualsense-battery-indicators"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"

[dependencies]
crc32fast = "1.5.0"
hidapi = "2.6.6"
single-instance = "0.3.3"

[build-dependencies]
ico = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }
